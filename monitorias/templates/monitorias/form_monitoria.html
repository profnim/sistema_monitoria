{% extends 'monitorias/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h3 class="card-title mb-4">Cadastrar Nova Monitoria</h3>
                
<form method="post">
    {% csrf_token %}
    
    <div class="mb-3">
        <label for="disciplina" class="form-label">Disciplina</label>
        <input type="text" name="disciplina" class="form-control" value="{{ monitoria.disciplina }}" required>
    </div>

    <div class="mb-3">
        <label for="assunto" class="form-label">Assunto</label>
        <input type="text" name="assunto" class="form-control" value="{{ monitoria.assunto }}" required>
    </div>

    <div class="mb-3">
        <label for="monitor" class="form-label">Monitor Responsável</label>
        <select name="monitor" id="monitor" class="form-select" required>
            <option value="" disabled>Selecione um monitor...</option>
            {% for m in monitores %}
                <option value="{{ m.id }}" {% if monitoria.monitor.id == m.id %}selected{% endif %}>
                    {{ m.get_full_name|default:m.username }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- SEÇÃO DE DATAS E HORÁRIOS MÚLTIPLOS (LADO A LADO) -->
    <hr class="my-4">
    <h5 class="mb-3 text-secondary" style="font-size: 1rem;">Datas e Horários da Monitoria</h5>
    
    <div id="container-horarios">
        {% if monitoria and monitoria.horarios.all %}
            {% for h in monitoria.horarios.all %}
                <div class="row align-items-end mb-3 horario-row">
                    <div class="col-md-4">
                        <label class="form-label">Data</label>
                        <input type="date" name="datas[]" class="form-control" value="{{ h.data|date:'Y-m-d' }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Início</label>
                        <input type="time" name="horarios_inicio[]" class="form-control" value="{{ h.horario_inicio|time:'H:i' }}" required>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Término</label>
                        <input type="time" name="horarios_fim[]" class="form-control" value="{{ h.horario_fim|time:'H:i' }}" required>
                    </div>
                    <div class="col-md-2">
                        <button type="button" class="btn btn-outline-danger w-100 btn-remover" title="Remover horário">
                            Remover
                        </button>
                    </div>
                </div>
            {% endfor %}
        {% else %}
            <!-- Linha padrão vazia para quando estiver cadastrando uma nova monitoria -->
            <div class="row align-items-end mb-3 horario-row">
                <div class="col-md-4">
                    <label class="form-label">Data</label>
                    <input type="date" name="datas[]" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Início</label>
                    <input type="time" name="horarios_inicio[]" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Término</label>
                    <input type="time" name="horarios_fim[]" class="form-control" required>
                </div>
                <div class="col-md-2">
                    <button type="button" class="btn btn-outline-danger w-100 btn-remover" title="Remover horário">
                        Remover
                    </button>
                </div>
            </div>
        {% endif %}
    </div>

    <!-- Botão para adicionar mais linhas -->
    <div class="mb-4">
        <button type="button" id="btn-adicionar-horario" class="btn btn-outline-secondary btn-sm">
            + Adicionar Outra Data/Horário
        </button>
    </div>
    <hr class="my-4">
    <!-- FIM DA SEÇÃO DE HORÁRIOS -->

    <div class="mb-3">
        <label for="local" class="form-label">Local / Sala</label>
        <input type="text" name="local" class="form-control" value="{{ monitoria.local }}" required>
    </div>

    <div class="mb-3">
        <label for="vagas_limite" class="form-label">Limite de Vagas</label>
        <input type="number" name="vagas_limite" class="form-control" value="{{ monitoria.vagas_limite }}" required>
    </div>

    <button type="submit" class="btn btn-primary">{% if editando %}Salvar Alterações{% else %}Cadastrar Monitoria{% endif %}</button>
    <a href="{% url 'painel_admin' %}" class="btn btn-secondary">Cancelar</a>
</form>
            </div>
        </div>
    </div>
</div>

<!-- Script JavaScript para gerenciar a adição e remoção dinâmica das linhas -->
<script>
    document.getElementById('btn-adicionar-horario').addEventListener('click', function() {
        const container = document.getElementById('container-horarios');
        const primeiraLinha = container.querySelector('.horario-row');
        const novaLinha = primeiraLinha.cloneNode(true);
        
        // Limpa os valores preenchidos na linha copiada
        novaLinha.querySelectorAll('input').forEach(input => input.value = '');
        
        // Configura o botão de remover da nova linha
        novaLinha.querySelector('.btn-remover').addEventListener('click', function() {
            if (container.querySelectorAll('.horario-row').length > 1) {
                novaLinha.remove();
            } else {
                alert('Você precisa manter pelo menos um horário.');
            }
        });

        container.appendChild(novaLinha);
    });

    // Configura o botão de remover da primeira linha original
    document.querySelector('.btn-remover').addEventListener('click', function() {
        const container = document.getElementById('container-horarios');
        if (container.querySelectorAll('.horario-row').length > 1) {
            this.closest('.horario-row').remove();
        } else {
            alert('Você precisa manter pelo menos um horário.');
        }
    });
</script>
{% endblock %}
